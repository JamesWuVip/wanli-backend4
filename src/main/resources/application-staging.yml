# 测试环境配置
spring:
  profiles:
    active: staging
  
  # 数据源配置 - Railway PostgreSQL
  datasource:
    url: ${RAILWAY_DATABASE_URL:jdbc:postgresql://localhost:5432/wanli_staging_db}
    username: ${RAILWAY_DATABASE_USERNAME:wanli_staging_user}
    password: ${RAILWAY_DATABASE_PASSWORD:wanli_staging_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 10
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai

# 服务器配置
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# JWT配置
jwt:
  secret: ${JWT_SECRET:stagingSecretKeyForWanliEducationBackendSystem2024}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7200000}

# 日志配置
logging:
  level:
    com.wanli: info
    org.springframework.web: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wanli-backend-staging.log